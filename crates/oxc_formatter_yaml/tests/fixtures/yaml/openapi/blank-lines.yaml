# A blank line travels with the entry it preceded.
#
# Blank-line preservation normally measures the source gap between two adjacent entries, which
# says nothing once entries move. The fact is therefore captured per entry in source order
# before permuting, then consulted through the permutation.
#
# `/travels`: the blank precedes `summary` in the source, and follows it to its new position
# between `operationId` and `responses`.
#
# `/to-front`: the blank precedes `operationId`, which ordering moves to first position. There
# is no preceding entry to separate it from, so the blank is dropped. Nothing else can happen --
# a blank line between `get:` and its first entry is already dropped without this feature.
openapi: 3.0.0
paths:
  /travels:
    get:
      responses: {}

      summary: s
      operationId: op
  /to-front:
    get:
      responses: {}

      operationId: op
